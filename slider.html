<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />

    <!-- Demo styles -->
    <style>
      html,
      body {
        position: relative;
        margin: auto;
        height: 90%;
      }

      body {
        background: #fff;
        font-family:
          Helvetica Neue,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 14px;
        color: #fff;
        margin: 0;
        padding: 0;
      }

      .swiper {
        width: 95%;
        height: 90%;
      }

      .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #444;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 300px;
        height: 300px;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .swiper {
        margin-left: auto;
        margin-right: auto;
      }
      
      h1 {
        display: flex;
        justify-content: center;
        color: #000;
        margin: 50px;
      }

      .swiper-pagination {
        margin-bottom: 200px;
      }
    </style>
  </head>

  <body>
    <h1>Gallery Property</h1>
    <!-- Swiper -->
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide"><img src="assets/property-1.jpg"></div>
        <div class="swiper-slide"><img src="assets/property-2.jpg"></div>
        <div class="swiper-slide"><img src="assets/property-3.jpg"></div>
        <div class="swiper-slide"><img src="assets/property-4.jpg"></div>
        <div class="swiper-slide"><img src="assets/property-5.jpg"></div>
        <div class="swiper-slide"><img src="assets/property-6.jpg"></div>
        <div class="swiper-slide"><img src="assets/property-7.jpg"></div>
        <div class="swiper-slide"><img src="assets/property-8.jpg"></div>
        <div class="swiper-slide"><img src="assets/property-9.jpg"></div>
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      
    </div>
    <div class="swiper-pagination"></div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper('.mySwiper', {
        slidesPerView: 3,
        spaceBetween: 20,
        loop: true,
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
      });
    </script>
  </body>
</html>
